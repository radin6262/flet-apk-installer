[project]
name = "flet-apk-installer"
version = "0.1.0"
description = "FletApkInstaller control for Flet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.86.5",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[tool.setuptools.package-data]
"flutter.flet_apk_installer" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
